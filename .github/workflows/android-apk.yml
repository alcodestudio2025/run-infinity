name: Android Debug APK

on:
  push:
    branches:
      - "cursor/m4-android-apk-f957"
      - "cursor/m4-1-mobile-input-f957"
      - "cursor/m5-1-grapple-playable"
  pull_request:
    ## Stacked APK PRs: M4→M3.4, M4.1→M4, M5.1→M5.0 tip.
    branches:
      - "cursor/m3-4-android-touch-f957"
      - "cursor/m4-android-apk-f957"
      - "cursor/m5-0-grapple-design"
  workflow_dispatch:

## Separate from headless smokes (godot-ci.yml). Produces a debug APK artifact only.
## No production secrets / release signing.

jobs:
  export-debug-apk:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.7.2
        env:
          GODOT_VERSION: 4.7.2-stable
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            unzip curl ca-certificates \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libfontconfig1 \
            libdbus-1-3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libasound2t64 2>/dev/null \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libasound2 || true
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -L -o /tmp/godot.zip "$url"
          unzip -qo /tmp/godot.zip -d /tmp/godot
          bin="$(find /tmp/godot -type f -name 'Godot_v*_linux.x86_64' | head -1)"
          sudo install -m 755 "$bin" /usr/local/bin/godot
          godot --version

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-34-ndk27-${{ runner.os }}

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-export-templates-4.7.2.stable

      - name: Setup Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          chmod +x scripts/android/setup_android_sdk.sh
          scripts/android/setup_android_sdk.sh
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Configure Godot Android editor settings
        run: |
          set -euo pipefail
          chmod +x scripts/android/configure_godot_android.sh
          scripts/android/configure_godot_android.sh

      - name: Export debug APK
        env:
          RI_ANDROID_PACKAGE: com.alcodestudio.runinfinity
        run: |
          set -euo pipefail
          chmod +x scripts/android/export_debug_apk.sh
          scripts/android/export_debug_apk.sh
          ls -la build/android/
          cat build/android/RunInfinity-debug.apk.sha256

      - name: Verify APK (static)
        run: |
          set -euo pipefail
          chmod +x scripts/ci/m4_apk_verify.sh
          scripts/ci/m4_apk_verify.sh build/android/RunInfinity-debug.apk 2>&1 | tee /tmp/m4-apk-verify.log
          grep -q 'M4 APK verify PASS' /tmp/m4-apk-verify.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunInfinity-debug-apk
          path: |
            build/android/RunInfinity-debug.apk
            build/android/RunInfinity-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
